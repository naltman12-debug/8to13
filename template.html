<script>
const DATA=__DATA__, D=DATA.bands, HIST=DATA.hist, ASOF=DATA.asof;
const COLORS={"Technology":"#2b5c9e","Health Care":"#2e8b7a","Finance":"#55703f","Consumer Discretionary":"#b5543c","Industrials":"#8a7350","Real Estate":"#c08a2e","Energy":"#424b55","Utilities":"#79a052","Consumer Staples":"#8b5d86","Telecommunications":"#3c8fb0","Basic Materials":"#8c99a5","Other":"#bcc4cc"};
const col=s=>COLORS[s]||"#999";
const fmt=m=>m>=1e6?"$"+(m/1e6).toFixed(2)+"T":m>=1e5?"$"+Math.round(m/1e3)+"B":m>=1e3?"$"+(m/1e3).toFixed(1)+"B":"$"+(m>=100?Math.round(m):m.toFixed(1))+"M";
const fmt3=m=>m>=1e6?"$"+(m/1e6).toPrecision(3)+"T":m>=1e3?"$"+(m/1e3).toPrecision(3)+"B":"$"+m.toPrecision(3)+"M";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOTAL=D.reduce((a,b)=>a+b.n,0);
D.forEach((d,i)=>d.digits=13-i);
document.getElementById("asof").textContent="Prices as of "+ASOF;
const JUMP=[["home","Home"],["overview","Overview"],["sectors","Sectors"],["history","5-year view"]].concat(D.map(d=>[d.id,d.band]));
const J=document.getElementById("jump");
J.innerHTML=JUMP.map(([id,l])=>`<option value="${id}">${l}</option>`).join("");
J.onchange=()=>{location.hash=J.value;};
const V=document.getElementById("view");
const legend=keys=>`<div class="legend">${Object.keys(COLORS).filter(k=>keys.has(k)).map(k=>`<span><i style="background:${col(k)}"></i>${k}</span>`).join("")}</div>`;
const stack=d=>{const e=Object.entries(d.sectors).sort((a,b)=>b[1]-a[1]);return `<div class="stack" role="img" aria-label="${d.band} sector mix: ${e.map(x=>x[0]+" "+x[1]+"%").join(", ")}">${e.map(([k,v])=>`<div title="${k} ${v}%" style="width:${v}%;background:${col(k)}">${v>=9?Math.round(v)+"%":""}</div>`).join("")}</div>`;};

const ALL=D.flatMap((d,bi)=>d.cos.map(c=>({m:c[2],s:c[3],bi})));
const TOTALVAL=ALL.reduce((a,c)=>a+c.m,0);
const SECTORS=Object.keys(COLORS).filter(s=>ALL.some(c=>c.s===s));
const med=a=>{const s=a.slice().sort((x,y)=>x-y),n=s.length;return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0;};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const SHORT=["$1T+","$100B–1T","$10B–100B","$1B–10B","$100M–1B","$10M–100M"];
const dash='<span class="z">—</span>';
// Spreadsheet-style table: click any header to sort, click again to flip
function sortable(el,cols,data,opt={}){
  let k=opt.k||cols[0].k, dir=opt.dir||-1;
  const val=(row,c)=>c.sort?c.sort(row):row[c.k];
  function draw(){
    const c0=cols.find(c=>c.k===k);
    const r=data.slice().sort((a,b)=>{const x=val(a,c0),y=val(b,c0);return (typeof x==="string"?x.localeCompare(y):x-y)*dir;});
    const al=c=>c.left?' style="text-align:left"':'';
    el.innerHTML=`<thead><tr>${cols.map(c=>`<th${al(c)} aria-sort="${c.k===k?(dir<0?"descending":"ascending"):"none"}"><button data-k="${c.k}">${c.label}${c.k===k?(dir<0?" ↓":" ↑"):""}</button></th>`).join("")}</tr></thead>
    <tbody>${r.map(row=>`<tr${opt.sel&&opt.sel(row)?' class="sel"':''}>${cols.map(c=>`<td${al(c)}>${c.fmt?c.fmt(row[c.k],row):row[c.k]}</td>`).join("")}</tr>`).join("")}</tbody>`;
    el.querySelectorAll("th button").forEach(b=>b.onclick=()=>{const nk=b.dataset.k,c=cols.find(x=>x.k===nk);if(nk===k)dir=-dir;else{k=nk;dir=typeof val(data[0],c)==="string"?1:-1;}draw();});
  }
  draw();
}
const nOrDash=v=>v?v.toLocaleString():dash;
const capOrDash=v=>v?fmt(v):dash;
const ratioOrDash=v=>v>0?v.toFixed(2)+"×":dash;

function sectorsView(sel){
  const rows=SECTORS.map(s=>{const cs=ALL.filter(c=>c.s===s),m=cs.map(c=>c.m),md=med(m),mn=avg(m);
    const v=m.reduce((a,b)=>a+b,0);const r={sector:s,n:cs.length,median:md,mean:mn,ratio:md?mn/md:0,val:v,pv:v/TOTALVAL};D.forEach((d,i)=>r["b"+i]=cs.filter(c=>c.bi===i).length);return r;});

  V.querySelectorAll(".cos th button").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;state.dir=state.k===k?-state.dir:(k===2?-1:1);state.k=k;V.querySelectorAll(".cos th button").forEach(x=>x.removeAttribute("data-dir"));b.dataset.dir=state.dir<0?"↓":"↑";rows();});
  rows();
  if(state.sec) setTimeout(()=>document.getElementById("list").scrollIntoView(),0);
}
function markSec(){document.querySelectorAll("#bsec .secbtn").forEach(b=>{const on=b.dataset.sec===state.sec;b.setAttribute("aria-pressed",on);b.closest("tr").classList.toggle("sel",on);});}
function rows(){
  const {d,q,sec,k,dir,shown}=state;
  let r=d.cos.filter(c=>(!sec||c[3]===sec)&&(!q||c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q)));
  r=r.slice().sort((a,b)=>(a[k]<b[k]?-1:a[k]>b[k]?1:0)*dir);
  document.getElementById("rows").innerHTML=r.slice(0,shown).map(c=>`<tr><td><b>${esc(c[0])}</b></td><td class="nm" title="${esc(c[1])}">${esc(c[1])}</td><td>${fmt(c[2])}</td><td class="sc" title="${esc(c[3])}"><i class="dot" style="background:${col(c[3])}"></i><span class="t">${esc(c[3])}</span></td><td class="sc ex">${c[4]}</td></tr>`).join("")||`<tr><td colspan="5" style="text-align:left;color:var(--muted)">No companies match. Clear the search or pick "All sectors".</td></tr>`;
  markSec();
  const ss=document.getElementById("secsum"), x=sec&&state.sr.find(z=>z.sector===sec);
  ss.hidden=!x;
  if(x){ss.innerHTML=`<div class="sh"><i class="dot" style="background:${col(sec)}"></i><span><b>${sec}</b> in ${d.band}</span><button class="clr" type="button">Show all sectors</button></div>
   <div class="sg"><div><b>${x.n.toLocaleString()}</b>companies, ${(100*x.pc).toFixed(1)}% of the band</div><div><b>${fmt(x.val)}</b>combined value, ${(100*x.pv).toFixed(1)}% of the band's value</div><div><b>${fmt(x.median)}</b>median market cap</div></div>`;
   ss.querySelector(".clr").onclick=()=>{state.sec="";document.getElementById("sf").value="";state.shown=100;rows();};}
  document.getElementById("cnt").textContent=`Showing ${Math.min(shown,r.length).toLocaleString()} of ${r.length.toLocaleString()}`;
  document.getElementById("more").hidden=r.length<=shown;
}
function route(){
  const [id0,param]=decodeURIComponent((location.hash||"#home").slice(1)).split("/");
  const d=D.find(x=>x.id===id0), id=d?id0:["sectors","overview","history","home"].includes(id0)?id0:"home";
  J.value=id; document.body.classList.toggle("home",id==="home");
  window.scrollTo(0,0);
  if(d) band(d,param); else if(id==="sectors") sectorsView(param); else if(id==="overview") overview(); else if(id==="history") historyView(); else home(param);
  placeAds(id);
  document.title=(d?d.band+" companies":id==="sectors"?(param?param+" by market cap":"Sectors"):id==="overview"?"Overview":id==="history"?"5-year view":"US stocks by market cap")+" · 8 to 13";
}
// Ads: small reserved slots, no pop-ups. Nothing shows until an ad client ID is filled in.
const ADS={client:"",slots:{top:"",home:"",rail:""},preview:false};
const adsOn=()=>!!ADS.client||ADS.preview;
let adLoaded=false;
function adHTML(kind){return adsOn()?`<div class="ad ad-${kind}${ADS.client?"":" preview"}" data-ad="${kind}" aria-label="Advertisement"><span class="ad-lbl">Advertisement</span></div>`:"";}
function fillAds(){
  if(!ADS.client)return;
  document.querySelectorAll(".ad[data-ad]:not([data-filled])").forEach(el=>{el.dataset.filled=1;el.insertAdjacentHTML("beforeend",`<ins class="adsbygoogle" style="display:block;width:100%;height:100%" data-ad-client="${ADS.client}" data-ad-slot="${ADS.slots[el.dataset.ad]||""}"></ins>`);(window.adsbygoogle=window.adsbygoogle||[]).push({});});
  if(!adLoaded){adLoaded=true;const go=()=>{const s=document.createElement("script");s.async=true;s.crossOrigin="anonymous";s.src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client="+ADS.client;document.head.appendChild(s);};(window.requestIdleCallback||setTimeout)(go,1500);}
}
function placeAds(id){
  if(!adsOn())return;
  if(id==="home"){const n=V.querySelector(".navs");if(n)n.insertAdjacentHTML("afterend",adHTML("home"));}
  else V.insertAdjacentHTML("afterbegin",adHTML("top"));
  const rail=document.getElementById("adRail");
  if(!rail.dataset.ad){rail.dataset.ad="rail";rail.innerHTML='<span class="ad-lbl">Advertisement</span>';if(!ADS.client)rail.classList.add("preview");}
  rail.classList.toggle("on",id!=="home");
  fillAds();
}
addEventListener("hashchange",route);route();
</script></body></html>
